name: Build and Push Images
on:
  push:
    branches: [main]
  # Only the test job runs for PRs, so Dependabot bumps are checked before they're merged
  pull_request:
env:
  REGISTRY: ghcr.io
jobs:
  # A failing test, lint or build error stops the deploy before any image is pushed
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: ./mvnw -B test
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run lint && npm run build
        working-directory: frontend
  build:
    needs: test
    # deploy needs build, so skipping it here skips both on PRs
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/plainoldmoose/idlwebapp-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/plainoldmoose/idlwebapp-${{ matrix.service }}:${{ github.sha }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # Pinned and checksummed, since this binary runs with the deploy secrets. Dependabot can't see it:
      # bump the version and hash from the release notes when Cloudflare deprecates this one
      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/download/2026.9.3/cloudflared-linux-amd64 -o cloudflared
          echo "77e26d8d900e0b8469f416239d14b5f296525fdf79fee6f511ef55609e3fbac2  cloudflared" | sha256sum -c -
          chmod +x cloudflared

      - name: Deploy via tunnel
        env:
          TUNNEL_SERVICE_HOSTNAME: ssh.idl-uk.com
          TUNNEL_SERVICE_URL: localhost:2222
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > key
          chmod 600 key
          # The server's host key, so ssh refuses anything else answering on the tunnel
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > known_hosts
          ./cloudflared access tcp &
          sleep 3
          # Copies the repo's compose file over first, so the server never runs its own copy. Pruning drops the
          # images each deploy replaces, which would otherwise fill the disk
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=known_hosts -p 2222 -i key root@localhost \
            "cat > /opt/idlwebapp/docker-compose.yml && cd /opt/idlwebapp && docker compose pull && docker compose up -d && docker image prune -f" \
            < docker-compose.yml
