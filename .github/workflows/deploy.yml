name: Build and Push Images
on:
  push:
    branches: [main]
  # Only the test job runs for PRs, so Dependabot bumps are checked before they're merged. Not for the release PR
  # into main: everything in pre-release was already tested, and the push to main tests again before deploying
  pull_request:
    branches: [pre-release]
# Actions are pinned to commit SHAs, so a moved tag can't swap in new code. Dependabot bumps the SHA and the
# version comment together
jobs:
  # A failing test, lint or build error stops the deploy before any image is pushed
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: ./mvnw -B test
        working-directory: backend
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Same as frontend/Dockerfile
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run lint && npm run build
        working-directory: frontend
  build:
    needs: test
    # deploy needs build, so skipping it here skips both on PRs
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/plainoldmoose/idlwebapp-${{ matrix.service }}:latest
            ghcr.io/plainoldmoose/idlwebapp-${{ matrix.service }}:${{ github.sha }}
  deploy:
    needs: build
    # One deploy at a time, so two quick merges can't interleave on the server
    concurrency: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned and checksummed, since this binary runs with the deploy secrets. Dependabot can't see it:
      # bump the version and hash from the release notes when Cloudflare deprecates this one
      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/download/2026.9.3/cloudflared-linux-amd64 -o cloudflared
          echo "77e26d8d900e0b8469f416239d14b5f296525fdf79fee6f511ef55609e3fbac2  cloudflared" | sha256sum -c -
          chmod +x cloudflared

      - name: Deploy via tunnel
        env:
          TUNNEL_SERVICE_HOSTNAME: ssh.idl-uk.com
          TUNNEL_SERVICE_URL: localhost:2222
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          # Read from the environment rather than pasted into the script
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          # The images this run built, rather than whatever :latest is by now
          TAG: ${{ github.sha }}
        run: |
          printf '%s\n' "$SSH_PRIVATE_KEY" > key
          chmod 600 key
          # The server's host key, so ssh refuses anything else answering on the tunnel
          printf '%s\n' "$SSH_KNOWN_HOSTS" > known_hosts
          ./cloudflared access tcp &
          timeout 30 bash -c 'until (: > /dev/tcp/localhost/2222) 2>/dev/null; do sleep 1; done'
          # Copies the repo's compose file over first, so the server never runs its own copy. Each deploy's images
          # have their own tag, so pruning needs -a to drop the old ones; images of running containers are kept
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=known_hosts -p 2222 -i key deploy@localhost \
            "cat > /opt/idlwebapp/docker-compose.yml && cd /opt/idlwebapp && export TAG=$TAG && docker compose pull && docker compose up -d && docker image prune -af && docker compose ps --format '{{.Image}}'" \
            < docker-compose.yml | tee images
          # The server must now be running this commit's images. A deploy that silently did something else, like a
          # forced command on the key that ignores the one above, fails here instead of going green
          grep -q "backend:$TAG" images && grep -q "frontend:$TAG" images || { echo "::error::Server isn't running $TAG"; exit 1; }
