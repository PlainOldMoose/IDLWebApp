name: Build and Push Images
on:
  push:
    branches: [main]
env:
  REGISTRY: ghcr.io
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/plainoldmoose/idlwebapp-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/plainoldmoose/idlwebapp-${{ matrix.service }}:${{ github.sha }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

      - name: Deploy via tunnel
        env:
          TUNNEL_SERVICE_HOSTNAME: ssh.vandermerwe.uk
          TUNNEL_SERVICE_URL: localhost:2222
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > key
          chmod 600 key
          ./cloudflared access tcp &
          sleep 3
          ssh -o StrictHostKeyChecking=no -p 2222 -i key root@localhost "cd /opt/idlwebapp && docker compose pull && docker compose up -d"
