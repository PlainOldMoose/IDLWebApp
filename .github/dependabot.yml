# Weekly PRs to keep dependencies patched
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    # typescript-eslint only supports the TypeScript versions it lists, so a new TypeScript major waits until it does
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
