# Prod runs this file: the deploy copies it to the server, which pulls the images instead of building them.
# Locally, `docker compose up --build` builds from source.
# TAG is the commit the deploy built (latest locally). To roll back, run `TAG=<sha> docker compose up -d` on the server
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      # From the environment or a .env next to this file (gitignored); the repo is public, so no default
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: idlwebapp
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d idlwebapp"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: ghcr.io/plainoldmoose/idlwebapp-backend:${TAG:-latest}
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/idlwebapp
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      BASE_URL: https://idl-uk.com
      # Moose, LightofSeven, Lacanos
      ADMIN_STEAM_IDS: 76561198090941997,76561198004530856,76561198083132868
    depends_on:
      db:
        condition: service_healthy
    # No published port: only nginx (frontend) reaches it, so its rate limits and headers can't be skipped
    restart: unless-stopped

  frontend:
    image: ghcr.io/plainoldmoose/idlwebapp-frontend:${TAG:-latest}
    build: ./frontend
    # Localhost only: the Cloudflare Tunnel is the way in
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
