# Per-client request limits (tunable). /auth/callback asks Steam to verify every hit, so it gets a far lower one
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;
# All clients together. ~100 players never get near it, so hitting it means a bot flood from many IPs:
# real users may see errors while it lasts, but the backend and the home upload stay within limits
limit_req_zone $server_name zone=global:1m rate=100r/s;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Everything arrives through cloudflared, so take the client's IP from Cloudflare's header,
    # trusted only from localhost, Docker and the LAN (wherever cloudflared runs)
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;
    limit_req_status 429;

    # JSON shrinks 4-9x, which is what keeps upload through the tunnel low. Cloudflare asks for gzip
    # through the tunnel, so compress proxied requests too
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/problem+json application/javascript text/css image/svg+xml;

    # HTTPS itself is forced at Cloudflare; HSTS stops browsers trying plain HTTP first.
    # All assets are same-origin, and nothing may frame the site (clickjacking)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Handle React Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API and auth requests to the backend. The exact /auth/callback match below wins over this regex
    proxy_set_header Host $host;
    location ~ ^/(api|auth)/ {
        limit_req zone=api burst=100 nodelay;
        limit_req zone=global burst=200 nodelay;
        proxy_pass http://backend:8080;
    }

    location = /auth/callback {
        limit_req zone=login burst=30 nodelay;
        limit_req zone=global burst=200 nodelay;
        proxy_pass http://backend:8080;
    }

    # A missing file 404s instead of getting index.html: Cloudflare caches .png/.gif/.js by extension, so a file
    # requested before the deploy that adds it would be served as HTML for hours. No route has a dot in it
    location ~ \.[a-zA-Z0-9]+$ {
        try_files $uri =404;
    }
}
