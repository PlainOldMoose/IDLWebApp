services:
  db:
    container_name: IDLWebApp
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: idlwebapp
      PGDATA: /data/postgres
    volumes:
      - db:/data/postgres
    ports:
      # This machine only, not the LAN
      - "127.0.0.1:5332:5432"
    restart: unless-stopped

volumes:
  db: