# App name
spring.application.name = IDLWebApp
spring.datasource.url = jdbc:postgresql://localhost:5332/idlwebapp
spring.datasource.username = admin
spring.datasource.password = password

# Where the frontend is served. In dev, Vite proxies /api and /auth from it to this app
app.base-url=${BASE_URL:http://localhost:5173}

# Steam IDs allowed to add players and seasons, comma-separated. Takes effect on their next login
app.admin-steam-ids=${ADMIN_STEAM_IDS:76561198090941997}

spring.jpa.hibernate.ddl-auto = update
spring.jpa.properties.hibernate.format_sql = true
spring.jpa.show-sql = true

# Seed data is loaded manually with scripts/reset-db.sh, never on startup
spring.sql.init.mode = never

# Errors thrown as ResponseStatusException come back as RFC 9457 problem details
spring.mvc.problemdetails.enabled = true

# Session cookie only over HTTPS (Cloudflare terminates TLS, so Tomcat can't tell on its own; browsers
# allow it on http://localhost for dev), and not sent on cross-site POSTs
server.servlet.session.cookie.secure = true
server.servlet.session.cookie.same-site = lax

# Login is Steam only. Without this, Boot adds an unused in-memory user and writes its password to the log
spring.autoconfigure.exclude = org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
